    ::error title=unpinned-action,file={{.Dir}}/.github/workflows/ci.yml,line=10::{{.Dir}}/.github/workflows/ci.yml:10:32: "actions/checkout@v6.0.2" must be pinned to a full length commit SHA
    ::error title=unpinned-action,file={{.Dir}}/.github/workflows/ci.yml,line=13::{{.Dir}}/.github/workflows/ci.yml:13:32: "actions/setup-go@v6.5.0" must be pinned to a full length commit SHA
