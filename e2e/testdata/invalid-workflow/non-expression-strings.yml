workflows:
  - name: non-expression-strings.yml
    content: |
      on: push
      permissions: {}
      concurrency:
        group: deploy
        cancel-in-progress: maybe
      jobs:
        deploy:
          runs-on: ubuntu-latest
          timeout-minutes: ten
          continue-on-error: maybe
          env: production
          environment:
            name: production
            deployment: maybe
          strategy:
            matrix: big
          steps:
            - run: echo hi
              env: production
              timeout-minutes: ten
              continue-on-error: maybe
            - uses: docker://alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
              with: oops
        matrix-entries:
          runs-on: ubuntu-latest
          timeout-minutes: 10
          strategy:
            matrix:
              os: ubuntu-latest
              include: big
          steps:
            - run: echo hi
