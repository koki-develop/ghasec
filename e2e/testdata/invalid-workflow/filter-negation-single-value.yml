workflows:
  - name: filter-negation-single-value-branches.yml
    content: |
      on:
        push:
          branches: '!main'
      permissions: {}
      jobs:
        build:
          runs-on: ubuntu-latest
          timeout-minutes: 10
          steps:
            - run: echo hi
  - name: filter-negation-single-value-paths.yml
    content: |
      on:
        pull_request:
          paths: '!docs/**'
      permissions: {}
      jobs:
        build:
          runs-on: ubuntu-latest
          timeout-minutes: 10
          steps:
            - run: echo hi

