workflows:
  - name: expression-strings-valid.yml
    content: |
      on: push
      permissions: {}
      concurrency:
        group: deploy
        cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
      jobs:
        test:
          runs-on: ubuntu-latest
          timeout-minutes: ${{ fromJSON(vars.TIMEOUT) }}
          continue-on-error: ${{ vars.ALLOW_FAILURE == 'true' }}
          env: ${{ fromJSON(vars.ENV_JSON) }}
          services: ${{ fromJSON(vars.SERVICES) }}
          environment:
            name: production
            deployment: ${{ vars.DEPLOY == 'true' }}
          strategy:
            matrix: ${{ fromJSON(vars.MATRIX) }}
          steps:
            - run: echo hi
              env: ${{ fromJSON(vars.STEP_ENV) }}
              timeout-minutes: ${{ fromJSON(vars.STEP_TIMEOUT) }}
              continue-on-error: ${{ vars.STEP_ALLOW == 'true' }}

expected:
  exit_code: 0
  stdout: ""
  stderr: |
    ✓ 1 file checked, no errors found
