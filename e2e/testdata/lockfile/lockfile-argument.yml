# actions.lock passed as an argument, as `ghasec .github/workflows/*` does,
# is skipped rather than linted as a workflow.
workflows:
  - name: .github/workflows/ci.yml
    content: |
      on: push
      permissions: {}
      jobs:
        test:
          runs-on: ubuntu-latest
          timeout-minutes: 10
          container:
            image: node:24
          steps:
            - uses: actions/checkout@v6.0.2
              with:
                persist-credentials: false
            - uses: actions/setup-go@v6.5.0
            - uses: docker://alpine:3.22
        release:
          uses: octo-org/shared/.github/workflows/release.yml@v1
  - name: .github/workflows/actions.lock
    content: |
      version: v0.0.3
      workflows:
        .github/workflows/ci.yml:
          - actions/checkout@v6.0.2
      dependencies:
        actions/checkout@v6.0.2:
          ref: v6.0.2
          commit: sha1-de0fac2e4500dabe0009e67214ff5f5447ce83dd
          owner_id: 44036562
          repo_id: 197814629

