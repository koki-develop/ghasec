# With --online, unpinned-transitive-action reads a locked action at the commit
# the lockfile records rather than at its tag. Refs inside it are locked too and
# are not reported; a docker:// step inside it is.
args: --online
workflows:
  - name: .github/workflows/ci.yml
    content: |
      on: push
      permissions: {}
      jobs:
        test:
          runs-on: ubuntu-latest
          timeout-minutes: 10
          steps:
            - uses: octo-org/locked-action@v1
lockfile: |
  version: v0.0.3
  workflows:
    .github/workflows/ci.yml:
      - octo-org/locked-action@v1
  dependencies:
    octo-org/locked-action@v1:
      ref: v1
      commit: sha1-dddddddddddddddddddddddddddddddddddddddd
      owner_id: 1
      repo_id: 1
      uses:
        - octo-org/inner-action@v2
    octo-org/inner-action@v2:
      ref: v2
      commit: sha1-eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      owner_id: 1
      repo_id: 2

expected:
  exit_code: 1
  stdout: ""
  stderr: |
    --> {{.Dir}}/.github/workflows/ci.yml:8:15
    ...
    3 | jobs:
    4 |   test:
    ...
    7 |     steps:
    8 |       - uses: octo-org/locked-action@v1
      |               ^^^^^^^^^^^^^^^^^^^^^^^^^ "octo-org/locked-action@v1" uses unpinned Docker action "docker://alpine:latest" (unpinned-transitive-action)
      Ref: https://github.com/koki-develop/ghasec/blob/main/rules/unpinned-transitive-action/README.md

    ✗ 1 error found in 1 of 1 file
